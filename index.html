<script>
"use strict";

/* =========================================================
   40 題題庫
   type 為計分類型：
   TF 專家達人、GM 專業經理人、AU 自主工作者、SE 安穩可靠者、

const QUESTIONS = [

  {id:21,type:"GM",text:"唯有當我成為公司高層的總經理或高階主管，我才感覺是職涯是成功的。"},

  {id:25,type:"SE",text:"我夢想擁有一個讓我感到工作穩定與不會任意變動的職涯。"},

  {id:34,type:"SV",text:"如果必須接受一個會逐漸損害我服務他人能力的職位時，我寧願離開公司。"},

  {id:36,type:"GM",text:"如果必須接受一個會讓我遠離成為高階主管的工作時，我寧願離開公司。"},
  {id:37,type:"SE",text:"當我感覺到自己擁有完全的財務及工作穩定感時，會使我在工作中最滿足。"},
  {id:38,type:"AU",text:"我寧願離開公司也不願接受一份會降低我的自由與自主性的工作。"},
  {id:39,type:"LS",text:"我總是尋找對自己及家庭關係造成最小影響的工作機會。"},
  {id:40,type:"CH",text:"對我而言，處理難以解決的問題比起獲得高階管理職務來得重要。"}

const TYPES = {
  TF:{name:"專家達人",en:"Technical / Functional Competence",keywords:"學習、成長、專業深度",desc:"你重視專業能力的累積與精進，希望因為真正擅長某個領域而獲得成就感。適合能持續深化技術、知識或專業判斷的工作。"},
  GM:{name:"專業經理人",en:"General Managerial Competence",keywords:"管理、整合、影響力",desc:"你重視整合人力與資源、承擔責任、影響組織結果。若分數高，管理職、跨部門協調與決策責任可能帶來較高滿足感。"},
  AU:{name:"自主工作者",en:"Autonomy / Independence",keywords:"自由、自主、掌控方式",desc:"你重視工作方法、節奏與決策的自主權。過度僵化、層層限制的環境可能降低滿足感。"},
  SE:{name:"安穩可靠者",en:"Security / Stability",keywords:"安全、穩定、可預期",desc:"你重視工作與財務的穩定、組織制度及可預期性。長期不確定或高風險環境可能較不符合你的核心需求。"},
  EC:{name:"創造者",en:"Entrepreneurial Creativity",keywords:"創新、創造、成就",desc:"你重視把自己的想法變成具體成果，包含產品、服務、制度或事業。從零到一與創造成果容易帶來成就感。"},
  SV:{name:"俠客",en:"Service / Dedication to a Cause",keywords:"服務、利他、價值",desc:"你重視工作的意義與對他人、社會或某項理念的貢獻。若分數高，使命感往往會直接影響職涯選擇。"},
  CH:{name:"挑戰者",en:"Pure Challenge",keywords:"挑戰、競爭、超越",desc:"你享受解決困難問題、突破限制與克服競爭。過於例行、缺乏難度的工作可能較難長期維持動力。"},
  LS:{name:"樂活族",en:"Lifestyle",keywords:"整合、平衡、生活",desc:"你重視工作、家庭與個人生活的整合。若分數高，職涯安排能否配合整體生活方式，通常比單一職稱更重要。"}
};

const quizSection = document.getElementById("quizSection");

/* 建立 40 題 Bootstrap 卡片 */
function renderQuestions() {
  quizSection.innerHTML = QUESTIONS.map(q => `
    <article class="card shadow-sm mb-3 question-card" id="qcard-${q.id}">
      <div class="card-body">
        <div class="d-flex gap-3 align-items-start mb-3">
          <span class="question-no">${q.id}</span>
          <div class="fs-5">${escapeHtml(q.text)}</div>
        </div>
        <div class="row g-2" role="radiogroup" aria-label="第 ${q.id} 題">
          ${[1,2,3,4].map(v => `
            <div class="col-6 col-md-3">
              <input class="btn-check answer-radio" type="radio" name="q${q.id}" id="q${q.id}_${v}" value="${v}" autocomplete="off">
              <label class="btn btn-outline-primary w-100 choice-label" for="q${q.id}_${v}">
                <strong>${v}</strong><br><small>${["","從未","偶爾","常常","總是"][v]}</small>
              </label>
            </div>`).join("")}
        </div>
      </div>
    </article>`).join("");
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]));
}

function getAnswers() {
  const answers = {};
  QUESTIONS.forEach(q => {
    const el = document.querySelector(`input[name="q${q.id}"]:checked`);
    answers[q.id] = el ? Number(el.value) : null;
  });
  return answers;
}

function updateProgress() {
  const answers = getAnswers();
  const done = Object.values(answers).filter(v => v !== null).length;
  const pct = Math.round(done / QUESTIONS.length * 100);
  document.getElementById("progressText").textContent = `已完成 ${done} / ${QUESTIONS.length} 題`;
  document.getElementById("progressBar").style.width = pct + "%";
  document.getElementById("progressBar").textContent = pct + "%";
  document.getElementById("saveState").textContent = done ? "作答中" : "尚未作答";
}

/* 計分：每類固定 5 題，最低 5 分、最高 20 分 */
function calculateScores(answers) {
  const scores = Object.fromEntries(Object.keys(TYPES).map(k => [k,0]));
  QUESTIONS.forEach(q => scores[q.type] += Number(answers[q.id] || 0));
  return scores;
}

/* 同分同名次且不跳號：dense ranking，例 18,18,17,17 => 1,1,2,2 */
function buildRanking(scores) {
  const rows = Object.entries(scores)
    .map(([code,score]) => ({code,score,...TYPES[code]}))
    .sort((a,b) => b.score - a.score || a.code.localeCompare(b.code));
  let rank = 0, previous = null;
  rows.forEach(row => {
    if (row.score !== previous) rank++;
    row.rank = rank;
    previous = row.score;
  });
  return rows;
}

function generateAnalysis(ranking) {
  const topScore = ranking[0].score;
  const top = ranking.filter(x => x.score === topScore);
  const secondScore = ranking.find(x => x.score < topScore)?.score;
  const second = secondScore === undefined ? [] : ranking.filter(x => x.score === secondScore);
  const lowScore = ranking[ranking.length - 1].score;
  const low = ranking.filter(x => x.score === lowScore);

  const topNames = top.map(x => `${x.code}「${x.name}」${x.score} 分`).join("、");
  const secondNames = second.map(x => `${x.code}「${x.name}」${x.score} 分`).join("、");
  const lowNames = low.map(x => `${x.code}「${x.name}」${x.score} 分`).join("、");

  let text = `你的最高職涯錨為 ${topNames}。`;
  if (top.length > 1) text += ` 最高分並列，表示這些價值在目前的職涯選擇中都很重要，不宜只用單一類型解讀。`;
  text += `\n\n${top.map(x => `【${x.code} ${x.name}】${x.desc}`).join("\n\n")}`;

  if (second.length) {
    text += `\n\n第二層的重要傾向是 ${secondNames}。這些分數與最高分的差距，可用來判斷它們是否也是你選工作時的重要條件。`;
  }

  text += `\n\n相對最低為 ${lowNames}。低分只代表「與其他職涯價值相比優先度較低」，不表示你完全不重視這項價值。`;

  const topKeywords = top.map(x => x.keywords).join("；");
  text += `\n\n【實際選工作時可檢查】\n把最高分的核心條件轉成面試問題：${topKeywords}。比較職缺時，不只看薪資與職稱，也檢查工作內容、主管授權、組織穩定度、成長空間與生活安排是否符合你的高分職涯錨。`;

  text += `\n\n本結果屬自我探索與職涯討論用途，不是心理診斷，也不應單獨作為錄用、淘汰或重大職涯決策的唯一依據。`;
  return text;
}

function renderResult() {
  const answers = getAnswers();
  const missing = QUESTIONS.filter(q => answers[q.id] === null);
  if (missing.length) {
    alert(`尚有 ${missing.length} 題未作答：${missing.map(q=>q.id).join("、")}`);
    document.getElementById(`qcard-${missing[0].id}`).scrollIntoView({behavior:"smooth"});
    return;
  }

  const scores = calculateScores(answers);
  const ranking = buildRanking(scores);

  document.getElementById("scoreTableBody").innerHTML = ranking.map(r => `
    <tr class="${r.rank===1 ? "rank-1" : ""}">
      <td><span class="badge ${r.rank===1 ? "text-bg-warning" : "text-bg-secondary"} score-badge">第 ${r.rank} 名</span></td>
      <td><strong>${r.code}</strong></td>
      <td>${escapeHtml(r.name)}</td>
      <td>${escapeHtml(r.en)}</td>
      <td><strong>${r.score}</strong> / 20</td>
    </tr>`).join("");

  const name = document.getElementById("testerName").value.trim();
  const date = document.getElementById("testDate").value;
  document.getElementById("resultMeta").textContent =
    `${name ? "姓名／代號：" + name + "　" : ""}${date ? "施測日期：" + date : ""}`;

  document.getElementById("analysisText").textContent = generateAnalysis(ranking);

  document.getElementById("detailAccordion").innerHTML = ranking.map((r,i) => {
    const qs = QUESTIONS.filter(q => q.type === r.code);
    return `
      <div class="accordion-item">
        <h2 class="accordion-header">
          <button class="accordion-button ${i ? "collapsed" : ""}" type="button" data-bs-toggle="collapse" data-bs-target="#detail-${r.code}">
            第 ${r.rank} 名｜${r.code} ${escapeHtml(r.name)}｜${r.score} 分
          </button>
        </h2>
        <div id="detail-${r.code}" class="accordion-collapse collapse ${i===0 ? "show" : ""}">
          <div class="accordion-body">
            ${qs.map(q => `<div class="border-bottom py-2"><strong>${q.id}.</strong> ${escapeHtml(q.text)} <span class="badge text-bg-primary float-end">${answers[q.id]} 分</span></div>`).join("")}
          </div>
        </div>
      </div>`;
  }).join("");

  document.getElementById("resultSection").classList.remove("d-none");
  renderScreenRadar(scores);
  document.getElementById("resultSection").scrollIntoView({behavior:"smooth"});
}

/* JSON 存檔：保留版本、日期、姓名、40 題答案，以及當時計算結果 */
function exportJson() {
  const answers = getAnswers();
  const scores = calculateScores(answers);
  const data = {
    schema:"career-anchor-40",
    version:1,
    exportedAt:new Date().toISOString(),
    testerName:document.getElementById("testerName").value,
    testDate:document.getElementById("testDate").value,
    answers,
    scores,
    ranking:buildRanking(scores).map(({code,name,score,rank}) => ({code,name,score,rank}))
  };
  const blob = new Blob([JSON.stringify(data,null,2)], {type:"application/json;charset=utf-8"});
  downloadBlob(blob, `career_anchor_${data.testDate || "result"}.json`);
}

function importJson(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (data.schema !== "career-anchor-40" || !data.answers) throw new Error("不是本測驗的 JSON 格式");
      document.getElementById("testerName").value = data.testerName || "";
      document.getElementById("testDate").value = data.testDate || "";
      QUESTIONS.forEach(q => {
        const v = Number(data.answers[q.id]);
        if ([1,2,3,4].includes(v)) {
          const radio = document.getElementById(`q${q.id}_${v}`);
          if (radio) radio.checked = true;
        }
      });
      updateProgress();
      renderResult();
    } catch(err) {
      alert("JSON 讀取失敗：" + err.message);
    }
  };
  reader.readAsText(file, "utf-8");
}

function downloadBlob(blob, filename) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  URL.revokeObjectURL(a.href);
  a.remove();
}

/* PDF 匯出：
   html2canvas 將結果區轉成高解析 Canvas，
   jsPDF 依 A4 比例自動分頁，不需伺服器。 */
async function exportPdf() {
  const btn = document.getElementById("exportPdfBtn");
  const old = btn.textContent;
  btn.disabled = true;
  btn.textContent = "產生 PDF 中…";
  try {
    // 展開所有明細，讓 PDF 可完整輸出
    document.querySelectorAll("#detailAccordion .accordion-collapse").forEach(el => el.classList.add("show"));

    const target = document.getElementById("pdfArea");
    const canvas = await html2canvas(target, {
      scale:2,
      useCORS:true,
      backgroundColor:"#ffffff",
      windowWidth:target.scrollWidth
    });

    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF("p","mm","a4");
    const pageW = 210, pageH = 297;
    const margin = 8;
    const usableW = pageW - margin*2;
    const imgW = usableW;
    const imgH = canvas.height * imgW / canvas.width;
    const usableH = pageH - margin*2;

    // 以裁切 Canvas 的方式分頁，避免單張超長圖片在 PDF 中被截斷
    const pxPerMm = canvas.width / imgW;
    const slicePxH = Math.floor(usableH * pxPerMm);
    let y = 0, page = 0;

    while (y < canvas.height) {
      const h = Math.min(slicePxH, canvas.height - y);
      const slice = document.createElement("canvas");
      slice.width = canvas.width;
      slice.height = h;
      slice.getContext("2d").drawImage(canvas, 0, y, canvas.width, h, 0, 0, canvas.width, h);
      const dataUrl = slice.toDataURL("image/jpeg",0.95);
      if (page > 0) pdf.addPage();
      const sliceMmH = h / pxPerMm;
      pdf.addImage(dataUrl,"JPEG",margin,margin,imgW,sliceMmH,undefined,"FAST");
      y += h;
      page++;
    }

    const date = document.getElementById("testDate").value || "result";
    pdf.save(`career_anchor_${date}.pdf`);
  } catch(err) {
    alert("PDF 產生失敗：" + err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = old;
  }
}

function clearAll() {
  if (!confirm("確定要清除姓名、日期與全部 40 題作答嗎？")) return;
  document.querySelectorAll(".answer-radio").forEach(x => x.checked = false);
  document.getElementById("testerName").value = "";
  document.getElementById("testDate").value = new Date().toISOString().slice(0,10);
  document.getElementById("resultSection").classList.add("d-none");
  updateProgress();
  window.scrollTo({top:0,behavior:"smooth"});
}

renderQuestions();
document.getElementById("testDate").value = new Date().toISOString().slice(0,10);
document.addEventListener("change", e => { if (e.target.classList.contains("answer-radio")) updateProgress(); });
document.getElementById("calculateBtn").addEventListener("click", renderResult);
document.getElementById("saveJsonBtn").addEventListener("click", exportJson);
document.getElementById("loadJsonInput").addEventListener("change", e => {
  if (e.target.files?.[0]) importJson(e.target.files[0]);
  e.target.value = "";
});

/* ===== V2：依老師答案卷題號排列，產生手寫卷 ===== */
const PDF_TYPE_ORDER=["TF","GM","AU","SE","EC","SV","CH","LS"];

function buildHandPdf(answers,ranking){
  const groups={};
  PDF_TYPE_ORDER.forEach(c=>groups[c]=QUESTIONS.filter(q=>q.type===c));
  const scores=calculateScores(answers);
  const name=document.getElementById("testerName").value.trim();
  const date=document.getElementById("testDate").value;
  let ry="",rm="",rd="";
  if(date){
    const p=date.split("-").map(Number);
    ry=p[0]-1911; rm=p[1]; rd=p[2];
  }

  const heads=PDF_TYPE_ORDER.map(c=>`<th colspan="2">${c}<br><small>（${escapeHtml(TYPES[c].name)}）</small></th>`).join("");
  let rows="";
  for(let i=0;i<5;i++){
    rows+="<tr>";
    PDF_TYPE_ORDER.forEach(c=>{
      const q=groups[c][i],deg=((q.id%5)-2)*0.8;
      rows+=`<td>${q.id}</td><td><span class="hw" style="transform:rotate(${deg}deg)">${answers[q.id]}</span></td>`;
    });
    rows+="</tr>";
  }
  const totals=PDF_TYPE_ORDER.map(c=>`<td>合計</td><td class="total">${scores[c]}</td>`).join("");
  const rankRows=ranking.map(r=>`<tr><td>${r.score}</td><td>${r.code}</td><td>${r.rank}</td></tr>`).join("");

  document.getElementById("pdfAnswer").innerHTML=`
    <div class="paper-title">答案卷</div>
    <div class="paper-date">施測日期： <span class="hw">${ry||"　"}</span> 年 <span class="hw">${rm||"　"}</span> 月 <span class="hw">${rd||"　"}</span> 日</div>
    ${name?`<div style="font-size:14px;margin-bottom:8px">姓名／代號：<span class="hw" style="font-size:18px">${escapeHtml(name)}</span></div>`:""}
    <table class="sheet"><thead><tr>${heads}</tr></thead><tbody>${rows}<tr>${totals}</tr></tbody></table>
    <div class="instruction">將合計後得出的八個分數依分數高低由高到低排列下來，<u>同分同名次</u>：</div>
    <table class="rank-sheet"><thead><tr><th>分數從高到低</th><th>英文代碼</th><th>順位／名次</th></tr></thead><tbody>${rankRows}</tbody></table>
    <div style="font-size:11px;color:#666;margin-top:12px">每類 5 題；各題 1～4 分；每類最高 20 分。名次採同分同名次、不跳號。</div>`;

  const analysis=generateAnalysis(ranking);
  document.getElementById("pdfAnalysis").innerHTML=`
    <h2>職涯錨定 8 大類型－結果分析</h2>
    <p>姓名／代號：${escapeHtml(name||"未填")}　　施測日期：${escapeHtml(date||"未填")}</p>
    <h3>八大類型分數</h3>
    <table class="analysis-table"><thead><tr><th>名次</th><th>代碼</th><th>類型</th><th>分數</th><th>核心價值</th></tr></thead><tbody>
    ${ranking.map(r=>`<tr><td>${r.rank}</td><td>${r.code}</td><td>${escapeHtml(r.name)}</td><td>${r.score}/20</td><td>${escapeHtml(r.keywords)}</td></tr>`).join("")}
    </tbody></table>
    <h3>八大職涯錨雷達圖</h3><div style="width:560px;height:390px;margin:4px auto 12px"><canvas id="pdfRadarChart"></canvas></div>
    <h3>完整分析</h3>
    ${analysis.split("\n\n").map(x=>`<p>${escapeHtml(x).replace(/\n/g,"<br>")}</p>`).join("")}
    <h3>結果說明</h3>
    <p>本結果用於職涯自我探索。分數呈現八種職涯價值的相對強度，不是能力高低或心理診斷。</p>`;
}

async function domToPdfPage(pdf,el,newPage){
  if(newPage) pdf.addPage("a4","p");
  const canvas=await html2canvas(el,{scale:2,useCORS:true,backgroundColor:"#fdfcf8",logging:false});
  pdf.addImage(canvas.toDataURL("image/jpeg",0.96),"JPEG",0,0,210,297,undefined,"FAST");
}

let screenRadarChart=null, pdfRadarChart=null;
function radarConfig(scores, animate){
  return {type:"radar",data:{labels:PDF_TYPE_ORDER.map(c=>`${c} ${TYPES[c].name}`),datasets:[{label:"職涯錨分數",data:PDF_TYPE_ORDER.map(c=>scores[c]),borderWidth:2,pointRadius:4,fill:true}]},options:{responsive:true,maintainAspectRatio:false,animation:animate,plugins:{legend:{position:"bottom"}},scales:{r:{min:0,max:20,ticks:{stepSize:5},pointLabels:{font:{size:13}}}}}};
}
function renderScreenRadar(scores){
  const c=document.getElementById("radarChart"); if(!c||!window.Chart)return;
  if(screenRadarChart)screenRadarChart.destroy();
  screenRadarChart=new Chart(c.getContext("2d"),radarConfig(scores,true));
}
function renderPdfRadar(scores){
  const c=document.getElementById("pdfRadarChart"); if(!c||!window.Chart)return;
  if(pdfRadarChart)pdfRadarChart.destroy();
  pdfRadarChart=new Chart(c.getContext("2d"),radarConfig(scores,false));
}

async function exportPdfV2(){
  const answers=getAnswers();
  const missing=QUESTIONS.filter(q=>answers[q.id]===null);
  if(missing.length){alert(`尚有 ${missing.length} 題未作答：${missing.map(q=>q.id).join("、")}`);return;}
  const ranking=buildRanking(calculateScores(answers));
  buildHandPdf(answers,ranking);
  renderPdfRadar(calculateScores(answers));

  const btn=document.getElementById("exportPdfBtn"),old=btn.textContent;
  btn.disabled=true; btn.textContent="產生手寫卷 PDF 中…";
  try{
    await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
    const {jsPDF}=window.jspdf;
    const pdf=new jsPDF({orientation:"p",unit:"mm",format:"a4",compress:true});
    await domToPdfPage(pdf,document.getElementById("pdfAnswer"),false);
    await domToPdfPage(pdf,document.getElementById("pdfAnalysis"),true);
    const date=document.getElementById("testDate").value||"result";
    pdf.save(`career_anchor_handwritten_${date}.pdf`);
  }catch(e){console.error(e);alert("PDF 產生失敗："+e.message);}
  finally{btn.disabled=false;btn.textContent=old;}
}

document.getElementById("exportPdfBtn").addEventListener("click", exportPdfV2);
document.getElementById("clearBtn").addEventListener("click", clearAll);
updateProgress();
</script>
